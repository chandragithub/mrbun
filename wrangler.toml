name = "mrbun"
main = "worker/index.ts"
compatibility_date = "2024-04-01"

# Automatically trigger Vite production build before deploying
[build]
command = "npm run build"

# Serve Vite React build assets with native Cloudflare SPA fallback
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Cloudflare D1 Database Binding for SQLite
[[d1_databases]]
binding = "DB"
database_name = "mrbun"
database_id = "0b367436-034c-462f-8811-c1ac76ea2023"

[vars]
COMPANY_NAME = "Mr Bun"
CONTACT_PHONE = "9476088111"
CONTACT_EMAIL = "contact@mrbun.in"
FSSAI_LICENSE = "22926112000173"
WORKERS_DEV_DOMAIN = "mrbun.ceansystech.workers.dev"

# Set sensitive production secrets via Wrangler CLI (Never commit secrets to Git):
# npx wrangler secret put AUTH_SECRET
# npx wrangler secret put MSG91_AUTH_KEY
# npx wrangler secret put MSG91_TOKEN_AUTH
# npx wrangler secret put CASHFREE_SECRET_KEY
# npx wrangler secret put ADMIN_DEFAULT_PASSWORD
